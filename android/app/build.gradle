import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Single source of truth for versions: the root package.json. release.yml
// validates the git tag against it and electron-builder stamps it into the
// installer, so the APK must derive its version instead of hand-bumping a
// rotting "1" / "1.0" pair here. Dependency-free (JsonSlurper ships with
// Groovy). versionCode = major*10000 + minor*100 + patch (supports 0-99
// minor/patch, which semver-in-practice covers for this app); versionName =
// the raw semver string. A pre-release suffix ("1.2.0-beta.1") is stripped
// from the code but kept in the name. A missing/unparseable package.json
// version must NOT break Gradle sync: the derivation is guarded and falls
// back to versionCode 1 / versionName "1.0" with a loud warning.
def packageJsonFile = new File(projectDir, '../../package.json')
def semver = '1.0'
def appVersionCode = 1
try {
    def packageJson = new JsonSlurper().parse(packageJsonFile)
    def rawVersion = (packageJson.version as String).trim()
    def coreParts = rawVersion.split('-')[0].split('\\.')
    if (coreParts.size() < 2 || !coreParts[0].isInteger() || !coreParts[1].isInteger()) {
        throw new IllegalStateException("version '${rawVersion}' has no integer major.minor")
    }
    semver = rawVersion
    appVersionCode = (coreParts[0] as int) * 10000 + (coreParts[1] as int) * 100 + (coreParts.size() > 2 && coreParts[2].isInteger() ? (coreParts[2] as int) : 0)
} catch (Exception e) {
    logger.warn("[versioning] Could not derive the version from ${packageJsonFile} (${e.message}) — falling back to versionCode 1 / versionName \"1.0\" so Gradle sync still works. Fix package.json's \"version\" field.")
}

// ── Release signing — OPTIONAL and self-disarming (audit 2026-09-16) ───────
// The MECHANISM only; the certificate itself is still a purchase/creation
// decision. If android/keystore.properties exists (created by hand, or
// provisioned in CI from the ANDROID_KEYSTORE_B64 secrets — see
// .github/workflows/release.yml "Provision Android signing"), the release
// build type gets a real signingConfig. Without it — the state of the world
// today — the release build stays UNSIGNED with a loud console warning,
// exactly the previous behavior, and no build fails.
// Expected properties (relative paths resolve against the android/ dir):
//   storeFile=release.keystore
//   storePassword=…  keyAlias=…  keyPassword=…
// NOTE: this file must never be committed — and android/.gitignore now says
// so: `*.jks`, `*.keystore`, `keystore.properties` and `release.keystore`
// are all ignored, so the signing material and its passwords cannot be
// staged by accident from the android/ tree.
def keystoreProperties = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
def releaseSigningReady = false
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProperties.load(it) }
    def missingKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        .findAll { key -> !keystoreProperties.getProperty(key)?.trim() }
    if (missingKeys) {
        logger.warn("[signing] android/keystore.properties present but incomplete (missing ${missingKeys.join(', ')}) — release build stays UNSIGNED")
    } else {
        def store = new File(rootDir, keystoreProperties['storeFile'])
        if (store.exists()) {
            releaseSigningReady = true
        } else {
            logger.warn("[signing] keystore file '${store}' referenced by android/keystore.properties does not exist — release build stays UNSIGNED")
        }
    }
} else {
    logger.warn("[signing] No android/keystore.properties — release APK/AAB stays UNSIGNED (debug installs unaffected; see the signing block in android/app/build.gradle)")
}

android {
    namespace "com.august35.tradingapp"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.august35.tradingapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName semver
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile new File(rootDir, keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Signed ONLY when android/keystore.properties was complete at
            // configuration time; otherwise the release build keeps the AGP
            // default (unsigned) - and the check below refuses to produce it.
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// FAIL CLOSED on an unsigned RELEASE build.
//
// An unsigned APK cannot be verified as the publisher's: nothing in it says
// who built it, so whoever served it could have built it. The Electron side
// already refuses to publish an unsigned installer unless the release asks for
// it by name (ALLOW_UNSIGNED_RELEASE in the release workflow); this is the
// same rule for Android, and it is NOT a purchase - an Android signing key is
// a key pair the owner creates (keytool) and stores as a secret.
//
// The check fires only for a RELEASE task, so a debug build is unaffected, and
// `-PallowUnsignedRelease` is the deliberate escape for a build the owner
// wants unsigned.
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseRequested && !releaseSigningReady && !project.hasProperty('allowUnsignedRelease')) {
    throw new GradleException(
        "Refusing to build an UNSIGNED release APK: an unsigned APK cannot be verified as the publisher's.\n" +
        "Create a signing key (keytool -genkeypair -keystore release.keystore -alias release ...) and put it\n" +
        "in android/keystore.properties (storeFile, storePassword, keyAlias, keyPassword) - the file is\n" +
        "gitignored - or pass -PallowUnsignedRelease=true to build unsigned on purpose."
    )
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
